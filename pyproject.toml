[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purce"
version = "0.1.0"
description = "Pure-C Semantic Compiler: converts Python/NumPy to self-contained C99"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "z3-solver>=4.12",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "z3-solver>=4.12",
    "mypy>=1.8",
]

[project.scripts]
purce = "purce.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["purce*"]

[tool.setuptools.package-data]
purce = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E741 ambiguous var (l/O) allowed in math kernels; F841 unused locals are
# pre-existing in builder.py dead branches — tracked, not blocking public launch
ignore = ["E741", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
[[tool.mypy.overrides]]
module = "purce.ir.builder"
ignore_errors = true
[[tool.mypy.overrides]]
module = "purce.verifier.equivalence"
ignore_errors = true
[[tool.mypy.overrides]]
module = "purce.parser.python_parser"
ignore_errors = true
[[tool.mypy.overrides]]
module = "purce.backend.c99_generator"
ignore_errors = true
[[tool.mypy.overrides]]
module = "purce.runtime.emitter"
ignore_errors = true
[[tool.mypy.overrides]]
module = "purce.verifier.coverage_sweep"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
