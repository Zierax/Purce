name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

      - name: Run fuzz verification
        run: python -c "from purce.verifier.fuzzer import DifferentialFuzzer; r = DifferentialFuzzer(seed=42).fuzz_all(iterations=50); fails = [k for k,v in r.items() if not v.all_passed]; assert not fails, f'Fuzz failures: {fails}'"

      - name: Run corpus gate
        run: python -m benchmarks.reproducible --baseline benchmarks/baseline.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check purce/ tests/

      - name: Ruff format
        run: ruff format --check purce/ tests/

      - name: Type check
        run: python -m mypy purce/ --ignore-missing-imports
